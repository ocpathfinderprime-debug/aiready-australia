services:
  api:
    build: ../04_runtime_code_v6/apps/api
    ports: ['3001:3001']
    env_file: .env
  worker:
    build: ../04_runtime_code_v6/apps/worker
    env_file: .env
  mcp:
    build: ../04_runtime_code_v6/apps/mcp
    ports: ['3002:3002']
    env_file: .env
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: example
    ports: ['5432:5432']
