[build]
  command = "echo 'Static site - no build step'"
  publish = "website"
  functions = "netlify/functions"

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/backend?path=/health"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/backend?path=/api/:splat"
  status = 200

[[redirects]]
  from = "/mcp/*"
  to = "/.netlify/functions/backend?path=/mcp/:splat"
  status = 200

[[redirects]]
  from = "/intake"
  to = "/intake.html"
  status = 200

[[redirects]]
  from = "/legal"
  to = "/legal.html"
  status = 200
